# Выходы десктопа: три монитора 1920x1080, все три в RTX 3060.
# Имена сняты с живой машины, не угаданы:
#   HDMI-A-1 — Acer S221HQL
#   DP-2     — Dell P2214H
#   HDMI-A-2 — Samsung (модель в EDID не заполнена)
# DP-1 не существует: единственный DisplayPort определился как DP-2.
# 2026-08-13 кабели Acer/Samsung переткнуты между портами — имена этих двух
# поменялись местами. position — левый верхний угол в логическом
# пространстве; порядок слева направо на столе меняется через x.
# Ложится в ~/.config/umbriel/outputs.toml, подключается include'ом.

[output.HDMI-A-1]   # Acer S221HQL
mode = "1920x1080"
position = [0, 0]

[output.DP-2]       # Dell P2214H
mode = "1920x1080"
position = [1920, 0]

[output.HDMI-A-2]   # Samsung
mode = "1920x1080"
position = [3840, 0]

[general]
# Samsung — зеркало Acer через wl-mirror; wayvnc на тот же HDMI-A-1 —
# курсор с ноута попадает туда, куда смотрит TV. Список autostart задаётся только здесь: массив из
# include'а заменил бы, а не дополнил, такой же в основном конфиге.
autostart = ["wl-mirror HDMI-A-1", "wayvnc -o HDMI-A-1"]

[[window_rule]]
match.app_id = "^at[.]yrlf[.]wl_mirror$"
default_output = "HDMI-A-2"
default_fullscreen = true
default_focused = false
