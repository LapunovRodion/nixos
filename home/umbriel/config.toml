# Umbriel — композитор от авторов noctalia. Перенос конфига niri (удалён
# 2026-10-08, лежит в git-истории: home/niri/config.kdl): раскладка, бинды
# и вид — те же, где у Umbriel есть аналог.
#
# Справка: https://docs.noctalia.dev/umbriel/  Проверка: `umbriel validate`
# Файл read-only (симлинк из /nix/store), поэтому всё машинозависимое и
# генерируемое подключается include'ами, а не дописывается сюда.

[include]
# Мониторы, wl-mirror и wayvnc — hosts/<машина>/umbriel.toml (home.nix).
files = ["outputs.toml"]

[include.optional]
# Цвета из палитры noctalia, рендерятся при каждой смене обоев
# (templates.user.umbriel в noctalia.nix). Optional: при первом входе
# файла ещё нет. Подключается последним — перебивает [colors].
files = ["noctalia.toml"]

[general]
# Аналог hotkey-overlay skip-at-startup: шпаргалка — Mod+Shift+/.
show_cheatsheet = false

[input.keyboard]
# ru-latin вместо ru — своя раскладка из ~/.config/xkb/symbols: кириллица
# та же, но на 3-4 уровнях латиница, и хоткеи с Ctrl/Alt/Super работают в
# русской группе как в английской. custom:types — штатная опция
# xkeyboard-config, подключает ~/.config/xkb/types/custom; без неё тип
# LATIN_FALLBACK не найдётся и раскладка не соберётся (см. home.nix).
layout = "us,ru-latin"
options = "grp:caps_toggle,custom:types"
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true

[input.cursor]
theme = "catppuccin-latte-dark-cursors"
size = 24

[layout]
gap = 10   # было 16; меньше воздуха, как в Caelestia
extent_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
default_extent_fraction = 0.5
# center_underfull_strip (по умолчанию true) — аналог
# always-center-single-column: одинокая колонка стоит по центру.
center_focused = "never"

[appearance]
# В niri prefer-no-csd был выключен — приложения рисуют свои заголовки.
prefer_no_csd = false
border_width = 2     # было 4
corner_radius = 16   # было 12; крупнее, в тон shell.corner_radius_scale 1.5

[appearance.shadow]
enabled = true       # в духе Caelestia (в niri были выключены)

# ---- Окна ----

# Неактивные окна НЕ приглушаются (ни [animation.dim_unfocused], ни
# правилом с opacity): сквозь прозрачные окна вроде Zen тогда проступали
# размытые обои — «замыливало». Снято 2026-10-08.

# Zen — «матовое стекло» (см. home/zen/transparent.css). Optimized-блюр (по
# умолчанию) размывает только обои — ровно как было в niri.
[[window_rule]]
match.app_id = "^zen-beta$"
blur = true

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Окно настроек noctalia — плавающим (из заводского конфига Umbriel).
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

# Стеклянные панели noctalia (panel.transparency_mode = "glass") — с
# настоящим размытием под ними; в niri его не было. Из заводского конфига.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

# ---- Бинды ----
# Таблица ЗАМЕНЯЕТ встроенный набор целиком. Порядок и смысл — как были
# в niri. Нет аналога у Umbriel (и потому нет здесь):
# reset-window-height, expand-column-to-available-width,
# center-visible-columns, tabbed-колонки (Mod+W), снимок окна (Alt+Print).
[keybinds]
"Mod+Shift+Slash" = "cheatsheet-toggle"

"Mod+T" = { action = "spawn:kitty", repeat = false }
"Mod+D" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+B" = { action = "spawn:zen-beta", repeat = false }
"Mod+E" = { action = "spawn:thunar", repeat = false }
"Mod+Alt+E" = { action = "spawn:kitty -e yazi", repeat = false }
"Super+Alt+L" = { action = "spawn:noctalia msg session lock", repeat = false }
"Super+Alt+S" = { action = "spawn:pkill orca || exec orca", allow_when_locked = true, repeat = false }

"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioStop" = { action = "spawn:playerctl stop", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:playerctl previous", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn:playerctl next", allow_when_locked = true }

"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }
"Mod+F7" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }
"Mod+F8" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }

"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }

"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
# J/K — гибрид: на краю колонки уходят на соседний воркспейс.
"Mod+J" = "window-focus-or-workspace-down"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+L" = "window-focus-right"

"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+J" = "window-move-down"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+L" = "column-move-right"

"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+J" = "output-focus-down"
"Mod+Shift+K" = "output-focus-up"
"Mod+Shift+L" = "output-focus-right"

"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"

"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"

"Mod+Shift+Page_Down" = "workspace-move-down"
"Mod+Shift+Page_Up" = "workspace-move-up"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"

"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Ctrl+1" = "column-move-to-workspace:1"
"Mod+Ctrl+2" = "column-move-to-workspace:2"
"Mod+Ctrl+3" = "column-move-to-workspace:3"
"Mod+Ctrl+4" = "column-move-to-workspace:4"
"Mod+Ctrl+5" = "column-move-to-workspace:5"
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"

"Mod+Tab" = "workspace-focus-last"
"Mod+Space" = { action = "spawn:noctalia msg window-switcher", repeat = false }

"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
# В niri Comma/Period втягивали соседа в колонку и выталкивали нижнее
# окно. У Umbriel так нельзя — ближайшее: вложить текущее окно в колонку
# слева/справа (как в его заводском конфиге).
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"

"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Ctrl+Shift+R" = "window-cycle-secondary-extent"

"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+C" = "column-center"

"Mod+Minus" = "window-modify-primary-extent:-0.1"
"Mod+Equal" = "window-modify-primary-extent:0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent:0.1"

# Раскладка ТЕКУЩЕГО воркспейса: Mod+W — по кругу scrolling → dwindle →
# master; Mod+Shift+W — сразу назад в scrolling. Остальные воркспейсы
# не трогает. Mod+W свободен: tabbed-колонок у Umbriel нет.
"Mod+W" = { action = "workspace-set-layout:toggle", repeat = false }
"Mod+Shift+W" = { action = "workspace-set-layout:scrolling", repeat = false }

"Mod+N" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+N" = { action = "window-focus-switch-floating", repeat = false }

# Своих скриншотов у Umbriel нет — Print'ы тоже через noctalia.
"Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Ctrl+Print" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }
"Mod+S" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Mod+Ctrl+S" = { action = "spawn:r=$(slurp) || exit 0; grim -g \"$r\" - | satty -f -", repeat = false }
"Mod+Shift+S" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }

"Mod+V" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Alt+Q" = { action = "spawn:noctalia msg panel-toggle yocraft/qrcode:panel", repeat = false }
"Mod+Alt+R" = { action = "spawn:screenrec", repeat = false }

"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+E" = { action = "session-quit", repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit", repeat = false }
"Mod+Shift+P" = { action = "dpms-off", repeat = false }
